# ============================================================================
# failures.conf — 已知失败/需过滤的测试用例配置（LIT_FILTER_OUT）。
#
# 格式说明:
#   [分支组]    目标分支分组；逗号分隔多个分支表示共享同一组用例；
#               [*] 表示所有分支通用（公共用例）。
#   aarch64:    arch 子块起始，其后缩进的行是该架构下的 lit 正则（每行一条）。
#   x86_64:     同上。
#   # 注释     可写在任意位置，说明失败原因 / issue 链接。
#
# 解析方式（ci.sh 内联 awk/sed，零额外依赖）:
#   1. 定位 tbranch 所在分组：键精确相等，或逗号分组包含 tbranch，或回退 [*]。
#   2. 取该分组 + 运行架构（ARCH）下的所有非注释、非空行。
#   3. 非 [*] 分组额外合并 [*] 的公共用例。
#   4. 每行作为一个 pattern，用 | 拼接为 LIT_FILTER_OUT。
#
# 新增用例: 直接在对应分支组的对应 arch 块下加一行即可，无需改代码。
# ============================================================================

# ==================== [*] 所有分支通用 ====================
